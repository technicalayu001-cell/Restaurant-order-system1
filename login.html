<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant SaaS - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:32px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
  text-align:center;
}

.logo{
  width:72px;
  height:72px;
  border-radius:20px;
  background:#f97316;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:38px;
  margin:0 auto 18px;
}

h1{
  margin:0 0 8px;
  font-size:25px;
}

.subtitle{
  color:#64748b;
  margin-bottom:28px;
}

.google{
  width:100%;
  border:0;
  padding:15px;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.google:disabled{
  opacity:.6;
}

.status{
  margin-top:18px;
  min-height:24px;
  font-size:14px;
}

.error{
  color:#dc2626;
}

.success{
  color:#16a34a;
}

.small{
  margin-top:25px;
  color:#94a3b8;
  font-size:12px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🍽️</div>

  <h1>Restaurant SaaS</h1>

  <div class="subtitle">
    Manage your restaurant easily
  </div>

  <button id="googleBtn" class="google">
    Continue with Google
  </button>

  <div id="status" class="status"></div>

  <div class="small">
    One Google account = One restaurant workspace
  </div>

</div>

<script>

const SUPABASE_URL =
"https://ltpjjckiaaonpetbzfvn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_skzmVVxdVcKTQaUbwEaIg_-KDmA-3L".replace(
  "sb_publishable_skzmVVxdVcKTQaUbwEaIg_-KDmA-3L",
  "sb_publishable_skzmVVxdVcKTQaUbwEaIg_-KDmA-3L"
);


/*
 IMPORTANT:
 Agar tumhare Supabase dashboard mein publishable key
 alag ho, to sirf upar SUPABASE_KEY ko apni current
 publishable key se replace karna.
*/

const ADMIN_URL =
"https://technicalayu001-cell.github.io/Restaurant-order-system1/admin/index.html";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      flowType:"pkce"
    }
  }
);

const googleBtn =
document.getElementById("googleBtn");

const statusBox =
document.getElementById("status");


function status(text,type=""){
  statusBox.textContent=text;
  statusBox.className="status "+type;
}


async function checkExistingSession(){

  try{

    const {data,error} =
      await supabaseClient.auth.getSession();

    if(error){
      console.error(error);
      return;
    }

    if(data && data.session){

      status("Already logged in. Opening admin...","success");

      setTimeout(()=>{
        window.location.replace(ADMIN_URL);
      },500);

    }

  }catch(error){
    console.error(error);
  }
}


supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    console.log("AUTH EVENT:",event);

    if(session){

      status("Login successful. Opening admin...","success");

      setTimeout(()=>{
        window.location.replace(ADMIN_URL);
      },300);

    }

  }
);


googleBtn.addEventListener("click",async()=>{

  googleBtn.disabled=true;

  status("Opening Google login...");

  try{

    const {error} =
      await supabaseClient.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:ADMIN_URL,

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }
        }

      });

    if(error){

      console.error(error);

      status(
        "Google login error: "+error.message,
        "error"
      );

      googleBtn.disabled=false;
    }

  }catch(error){

    console.error(error);

    status(
      "Something went wrong: "+error.message,
      "error"
    );

    googleBtn.disabled=false;
  }

});


checkExistingSession();

</script>

</body>
</html>
