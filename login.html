<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant SaaS - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7ed, #ffedd5);
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      color: #111827;
    }

    p {
      color: #6b7280;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      color: #dc2626;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🍽️</div>

    <h1>Restaurant SaaS</h1>

    <p>Manage your restaurant easily</p>

    <button id="googleLogin">
      Continue with Google
    </button>

    <div id="message"></div>

  </div>

<script>

  // ==============================
  // SUPABASE CONFIG
  // ==============================

  const SUPABASE_URL =
    "https://ltpjjckiaaonpetbzfvn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_skzmVVxdVcKTQaUbwqEaIg_-KDmA-3L";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // ADMIN PAGE URL
  // ==============================

  const ADMIN_URL =
    "https://technicalayu001-cell.github.io/Restaurant-order-system1/admin.html";


  const loginButton =
    document.getElementById("googleLogin");

  const message =
    document.getElementById("message");


  // ==============================
  // GOOGLE LOGIN
  // ==============================

  loginButton.addEventListener("click", async () => {

    loginButton.disabled = true;

    loginButton.textContent =
      "Opening Google...";

    message.textContent = "";


    const { error } =
      await supabaseClient.auth.signInWithOAuth({

        provider: "google",

        options: {
          redirectTo: ADMIN_URL
        }

      });


    if (error) {

      console.error(error);

      message.textContent =
        "Login error: " + error.message;

      loginButton.disabled = false;

      loginButton.textContent =
        "Continue with Google";

    }

  });


  // ==============================
  // CHECK EXISTING LOGIN
  // ==============================

  async function checkLogin() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      window.location.href =
        ADMIN_URL;

    }

  }


  checkLogin();

</script>

</body>
</html>
