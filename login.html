<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant SaaS - Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7f2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:390px;background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 35px #0002;text-align:center}
.logo{font-size:48px}.box h1{margin:8px 0}.box p{color:#666;line-height:1.5}
button{width:100%;border:0;border-radius:10px;padding:14px;background:#111827;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}.msg{margin-top:15px;color:#c62828;font-size:14px;min-height:20px}
.small{font-size:12px;color:#777;margin-top:18px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🍽️</div>
  <h1>Restaurant SaaS</h1>
  <p>Login with your Google account to manage your restaurant.</p>
  <button id="googleBtn">Continue with Google</button>
  <div id="msg" class="msg"></div>
  <div class="small">₹599/month after the 24-hour free trial.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ltpjjckiaaonpetbzfvn.supabase.co";
const SUPABASE_KEY="sb_publishable_skzmVVxdVcKTQaUbwEaIg_-KDmA-3L";
const ADMIN_URL="https://technicalayu001-cell.github.io/Restaurant-order-system1/admin/index.html";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    flowType:"pkce"
  }
});

const btn=document.getElementById("googleBtn");
const msg=document.getElementById("msg");

async function checkSession(){
  try{
    const {data}=await db.auth.getSession();
    if(data && data.session){
      location.replace(ADMIN_URL);
    }
  }catch(e){console.error(e)}
}

btn.addEventListener("click",async()=>{
  btn.disabled=true;
  msg.textContent="Opening Google login...";
  try{
    const {error}=await db.auth.signInWithOAuth({
      provider:"google",
      options:{
        redirectTo:ADMIN_URL,
        queryParams:{prompt:"select_account"}
      }
    });
    if(error) throw error;
  }catch(e){
    console.error(e);
    msg.textContent="Login error: "+(e.message||"Unknown error");
    btn.disabled=false;
  }
});

checkSession();
</script>
</body>
</html>
