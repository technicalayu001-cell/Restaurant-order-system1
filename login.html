<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant SaaS - Login</title>

  <meta name="theme-color" content="#ff6b00">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(135deg, rgba(255,107,0,.95), rgba(255,170,0,.9)),
        #ff6b00;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.20);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff6b00, #ff9800);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      box-shadow: 0 8px 20px rgba(255,107,0,.3);
    }

    h1 {
      font-size: 27px;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .google-btn {
      width: 100%;
      border: 1px solid #ddd;
      background: white;
      color: #222;
      height: 52px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      transition: .2s;
    }

    .google-btn:hover {
      background: #f7f7f7;
      transform: translateY(-1px);
    }

    .google-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .google-icon {
      width: 22px;
      height: 22px;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #c62828;
      border: 1px solid #ffcaca;
    }

    .success {
      display: block;
      background: #effbf3;
      color: #16833b;
      border: 1px solid #bde8ca;
    }

    .loading {
      display: none;
      margin-top: 18px;
      color: #777;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #ff6b00;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .trial {
      margin-top: 25px;
      padding: 14px;
      background: #fff8ed;
      border-radius: 12px;
      color: #7a4a00;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 22px;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        🍽️
      </div>

      <h1>Restaurant SaaS</h1>

      <p class="subtitle">
        Manage your restaurant, orders, menu, tables and billing — all in one place.
      </p>

      <button
        id="googleBtn"
        class="google-btn"
        onclick="loginWithGoogle()"
      >
        <svg
          class="google-icon"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill="#4285F4"
            d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
          />
          <path
            fill="#34A853"
            d="M12 21.7c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.7z"
          />
          <path
            fill="#FBBC05"
            d="M6.54 13.79A5.85 5.85 0 0 1 6.23 12c0-.62.11-1.23.31-1.79V7.68H3.3A9.73 9.73 0 0 0 2.27 12c0 1.57.38 3.05 1.03 4.32l3.24-2.53z"
          />
          <path
            fill="#EA4335"
            d="M12 6.18c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.24 14.63 2.3 12 2.3a9.74 9.74 0 0 0-8.7 5.38l3.24 2.53C7.31 7.9 9.46 6.18 12 6.18z"
          />
        </svg>

        Continue with Google
      </button>

      <div id="loading" class="loading">
        <span class="spinner"></span>
        Signing you in...
      </div>

      <div id="message" class="message"></div>

      <div class="trial">
        🎁 <strong>1-Day Free Trial</strong><br>
        Start your restaurant management journey with a free trial.
      </div>

      <div class="footer">
        By continuing, you agree to use Restaurant SaaS responsibly.
      </div>

    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* ================================
       SUPABASE CONFIG
    ================================= */

    const SUPABASE_URL =
      "https://ltpjjckiaaonpetbzfvn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_skzmVVxdVcKTQaUbwqEaIg_-KDmA-3L";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ================================
       IMPORTANT URL
    ================================= */

    const ADMIN_URL =
      "https://technicalayu001-cell.github.io/Restaurant-order-system1/admin/";


    /* ================================
       ELEMENTS
    ================================= */

    const googleBtn =
      document.getElementById("googleBtn");

    const loading =
      document.getElementById("loading");

    const message =
      document.getElementById("message");


    /* ================================
       MESSAGE
    ================================= */

    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className = "message";

    }


    /* ================================
       LOADING
    ================================= */

    function setLoading(status) {

      if (status) {

        loading.style.display = "block";

        googleBtn.disabled = true;

      } else {

        loading.style.display = "none";

        googleBtn.disabled = false;

      }

    }


    /* ================================
       GOOGLE LOGIN
    ================================= */

    async function loginWithGoogle() {

      clearMessage();

      setLoading(true);

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithOAuth({

            provider: "google",

            options: {

              redirectTo: ADMIN_URL,

              queryParams: {

                access_type: "offline",

                prompt: "select_account"

              }

            }

          });


        if (error) {

          console.error(
            "Google Login Error:",
            error
          );

          setLoading(false);

          showMessage(
            "Google login failed: " +
            error.message,
            "error"
          );

          return;

        }

      } catch (error) {

        console.error(error);

        setLoading(false);

        showMessage(
          "Something went wrong. Please try again.",
          "error"
        );

      }

    }


    /* ================================
       CHECK EXISTING SESSION
    ================================= */

    async function checkSession() {

      try {

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth.getSession();


        if (session) {

          console.log(
            "Existing session found"
          );

          window.location.replace(
            ADMIN_URL
          );

        }

      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    /* ================================
       AUTH STATE CHANGE
    ================================= */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Auth event:",
          event
        );


        if (
          event === "SIGNED_IN" &&
          session
        ) {

          showMessage(
            "Login successful! Opening dashboard...",
            "success"
          );

          setLoading(true);

          setTimeout(() => {

            window.location.replace(
              ADMIN_URL
            );

          }, 500);

        }

      }
    );


    /* ================================
       START
    ================================= */

    checkSession();

  </script>

</body>
</html>
