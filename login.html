<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant SaaS - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 92%;
      max-width: 390px;
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
      text-align: center;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 5px 0 8px;
      color: #111827;
      font-size: 26px;
    }

    p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      text-align: left;
    }

    .loading {
      display: none;
      margin-top: 15px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">🍽️</div>

  <h1>Restaurant SaaS</h1>

  <p>
    Manage your restaurant, orders, menu, tables and billing
    from one place.
  </p>

  <button id="googleBtn" onclick="loginWithGoogle()">
    Continue with Google
  </button>

  <div id="loading" class="loading">
    Opening Google Login...
  </div>

  <div id="error" class="error"></div>

</div>

<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://ltpjjckiaaonpetbzfvn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_skzmVVxdVcKTQaUbwEaIg_-KDmA-3L";


  // ==============================
  // ADMIN URL
  // ==============================

  const ADMIN_URL =
    "https://technicalayu001-cell.github.io/Restaurant-order-system1/admin/index.html";


  // ==============================
  // CREATE SUPABASE CLIENT
  // ==============================

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,

        // IMPORTANT:
        // GitHub Pages browser app ke liye
        // implicit OAuth flow.
        flowType: "implicit"
      }
    }
  );


  // ==============================
  // SHOW ERROR
  // ==============================

  function showError(message) {

    const box = document.getElementById("error");

    box.style.display = "block";

    box.textContent = message;

  }


  // ==============================
  // GOOGLE LOGIN
  // ==============================

  async function loginWithGoogle() {

    const button =
      document.getElementById("googleBtn");

    const loading =
      document.getElementById("loading");

    const error =
      document.getElementById("error");


    error.style.display = "none";

    button.disabled = true;

    loading.style.display = "block";


    try {

      const { error } =
        await db.auth.signInWithOAuth({

          provider: "google",

          options: {

            redirectTo: ADMIN_URL

          }

        });


      if (error) {

        throw error;

      }

    } catch (err) {

      console.error("Google Login Error:", err);

      button.disabled = false;

      loading.style.display = "none";

      showError(
        "Google login failed: " +
        (err.message || "Unknown error")
      );

    }

  }


  // ==============================
  // CHECK EXISTING SESSION
  // ==============================

  let redirected = false;


  async function checkExistingSession() {

    try {

      const {
        data: { session },
        error
      } = await db.auth.getSession();


      if (error) {

        console.error(
          "Session Error:",
          error
        );

        return;

      }


      if (session && session.user) {

        if (redirected) return;

        redirected = true;

        window.location.replace(
          ADMIN_URL
        );

      }

    } catch (err) {

      console.error(
        "Session Check Error:",
        err
      );

    }

  }


  // ==============================
  // AUTH STATE LISTENER
  // ==============================

  db.auth.onAuthStateChange(
    (event, session) => {

      console.log(
        "Auth Event:",
        event
      );


      if (
        session &&
        session.user &&
        !redirected
      ) {

        redirected = true;

        window.location.replace(
          ADMIN_URL
        );

      }

    }
  );


  // ==============================
  // PAGE LOAD
  // ==============================

  window.addEventListener(
    "load",
    () => {

      checkExistingSession();

    }
  );

</script>

</body>
</html>
