<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Restaurant SaaS - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:#f5f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:white;
  padding:35px 25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.logo{
  font-size:55px;
  margin-bottom:10px;
}

h1{
  font-size:26px;
  color:#111827;
  margin-bottom:10px;
}

p{
  color:#6b7280;
  margin-bottom:25px;
}

.google-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.google-btn:disabled{
  opacity:.6;
}

.status{
  margin-top:18px;
  color:#6b7280;
  font-size:14px;
}

.error{
  margin-top:15px;
  color:#dc2626;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🍽️</div>

  <h1>Restaurant SaaS</h1>

  <p>
    Manage your restaurant easily
  </p>

  <button
    id="googleBtn"
    class="google-btn"
    onclick="loginWithGoogle()">
    Continue with Google
  </button>

  <div id="status" class="status"></div>

  <div id="error" class="error"></div>

</div>


<script>

const SUPABASE_URL =
"https://ltpjjckiaaonpetbzfvn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_skzmVVxdVcKTQaUbwEaIg_-KDmA-3L";


const ADMIN_URL =
"https://technicalayu001-cell.github.io/Restaurant-order-system1/admin/index.html";


const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,

      /*
        LOGIN + ADMIN dono PKCE use karenge.
      */
      flowType:"pkce"
    }
  }
);


/* Existing session check */

async function checkExistingSession(){

  try{

    const {data,error} =
      await db.auth.getSession();

    if(error){
      console.error(error);
      return;
    }

    if(data?.session){

      $("status").textContent =
        "Already logged in...";

      window.location.replace(
        ADMIN_URL
      );

    }

  }catch(error){

    console.error(error);

  }

}


/* Google Login */

async function loginWithGoogle(){

  const btn=$("googleBtn");

  const status=$("status");

  const errorBox=$("error");

  btn.disabled=true;

  errorBox.textContent="";

  status.textContent=
    "Google login open ho raha hai...";


  try{

    const {data,error} =
      await db.auth.signInWithOAuth({

        provider:"google",

        options:{

          redirectTo:ADMIN_URL,

          /*
            PKCE flow ke saath Supabase
            callback se session automatically
            handle karega.
          */

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }

        }

      });


    if(error){
      throw error;
    }

    console.log(
      "OAuth started:",
      data
    );

  }catch(error){

    console.error(
      "Google login error:",
      error
    );

    status.textContent="";

    errorBox.textContent=
      error.message ||
      "Google login failed.";

    btn.disabled=false;

  }

}


function $(id){

  return document.getElementById(id);

}


/* Start */

document.addEventListener(
  "DOMContentLoaded",
  checkExistingSession
);

</script>

</body>
</html>
