<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.auth-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#fff7ed,#ffedd5);
}

.auth-card{
  width:100%;
  max-width:420px;
  background:white;
  padding:32px 24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
}

.auth-logo{
  width:75px;
  height:75px;
  margin:0 auto 18px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:22px;
  background:#f97316;
  color:white;
  font-size:40px;
}

.spinner{
  width:35px;
  height:35px;
  margin:20px auto;
  border:4px solid #e2e8f0;
  border-top-color:#f97316;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  overflow-y:auto;
  padding:20px;
  background:#111827;
  color:white;
  z-index:100;
}

.brand{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.restaurant-name{
  color:#cbd5e1;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
  word-break:break-word;
}

.nav-button{
  display:block;
  width:100%;
  margin:5px 0;
  padding:12px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
}

.nav-button:hover,
.nav-button.active{
  background:#f97316;
  color:white;
}

.logout-button{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:1px solid #475569;
  border-radius:10px;
  background:transparent;
  color:white;
}

.main{
  margin-left:250px;
  padding:24px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.page-title{
  font-size:28px;
  font-weight:bold;
}

.user-email{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

.mobile-menu{
  display:none;
  margin-right:8px;
  padding:9px 12px;
  border:0;
  border-radius:9px;
  background:#111827;
  color:white;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 15px rgba(15,23,42,.06);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.two-column{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.stat-label{
  color:#64748b;
  font-size:13px;
}

.stat-value{
  margin-top:8px;
  font-size:28px;
  font-weight:bold;
}

.section{
  margin-top:20px;
}

.muted{
  color:#64748b;
  font-size:13px;
}

.btn{
  padding:10px 14px;
  border:0;
  border-radius:9px;
  background:#f97316;
  color:white;
  font-weight:bold;
}

.btn-dark{
  background:#111827;
}

.btn-green{
  background:#16a34a;
}

.btn-red{
  background:#dc2626;
}

.btn-gray{
  background:#64748b;
}

input,
select,
textarea{
  width:100%;
  margin-top:6px;
  margin-bottom:14px;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  background:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
  font-size:14px;
  vertical-align:top;
}

.table-scroll{
  overflow-x:auto;
}

.order-card{
  margin-top:12px;
  padding:16px;
  border:1px solid #e2e8f0;
  border-radius:14px;
}

.badge{
  display:inline-block;
  margin-top:7px;
  padding:5px 9px;
  border-radius:20px;
  background:#e2e8f0;
  font-size:12px;
}

.qr-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.qr-card{
  padding:18px;
  background:white;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 15px rgba(15,23,42,.06);
}

.qr-box{
  display:flex;
  justify-content:center;
  margin:15px 0;
}

.subscription-box{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:rgba(15,23,42,.8);
}

.subscription-card{
  width:100%;
  max-width:430px;
  padding:30px;
  border-radius:22px;
  background:white;
  text-align:center;
}

.price{
  margin:15px 0;
  color:#f97316;
  font-size:40px;
  font-weight:bold;
}

@media(max-width:950px){
  .sidebar{
    width:220px;
  }

  .main{
    margin-left:220px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .qr-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .sidebar{
    transform:translateX(-100%);
    transition:transform .25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:15px;
  }

  .mobile-menu{
    display:inline-block;
  }

  .grid,
  .two-column,
  .qr-grid{
    grid-template-columns:1fr;
  }

  .page-title{
    font-size:23px;
  }
}
</style>
</head>

<body>

    <button class="nav-button" data-page="waiters" onclick="openPage('waiters',this)">

<!-- SUBSCRIPTION SCREEN -->

    </p>

    <div class="price">

<script>
const SUPABASE_URL =
"https://ltpjjckiaaonpetbzfvn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_skzmVVxdVcKTQaUbwqEaIg_-KDmA-3L";

const LOGIN_URL =
"https://technicalayu001-cell.github.io/Restaurant-order-system1/login.html";

const CUSTOMER_URL =
"https://technicalayu001-cell.github.io/Restaurant-order-system1/index.html";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      flowType:"pkce"
    }
  }
);

let currentUser = null;
let restaurant = null;
let restaurantId = null;
let currentPage = "dashboard";

let realtimeOrders = null;
let realtimeWaiters = null;
let pollingTimer = null;
let midnightTimer = null;

let lastOrderId = null;
let lastWaiterId = null;
let pollingStarted = false;


/* =========================
   BASIC HELPERS
========================= */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttribute(value){
  return escapeHTML(value);
}

function money(value){
  return "₹" + Number(value || 0).toFixed(2);
}

function goToLogin(){
  window.location.replace(LOGIN_URL);
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function showError(message){
  document.getElementById("authSpinner").classList.add("hidden");
  document.getElementById("authText").textContent = "Restaurant setup error";
  document.getElementById("authError").textContent = message;
  document.getElementById("backLoginButton").classList.remove("hidden");
}


/* =========================
   AUTH SESSION
========================= */

async function waitForSession(){

  const start = Date.now();

  while(Date.now() - start < 20000){

    const result = await db.auth.getSession();

    if(result.data && result.data.session){
      return result.data.session;
    }

    await new Promise(resolve => setTimeout(resolve,500));
  }

  return null;
}

db.auth.onAuthStateChange(async(event,session)=>{

  console.log("Auth event:",event);

  if(session && !currentUser){

    currentUser = session.user;

    document.getElementById("userEmail").textContent =
      currentUser.email || "";

    await loadRestaurantForUser();
  }

});

async function initAuth(){

  try{

    const session = await waitForSession();

    if(!session){

      showError("Google login session nahi mila. Please login again.");
      return;
    }

    currentUser = session.user;

    document.getElementById("userEmail").textContent =
      currentUser.email || "";

    await loadRestaurantForUser();

  }catch(error){

    console.error(error);
    showError(error.message);

  }
}


/* =========================
   MULTI RESTAURANT SETUP
========================= */

async function loadRestaurantForUser(){

  try{

    const userId = currentUser.id;

    let membershipResult = await db
      .from("restaurant_users")
      .select("restaurant_id,role")
      .eq("user_id",userId)
      .limit(1);

    if(membershipResult.error){
      throw membershipResult.error;
    }

    if(
      membershipResult.data &&
      membershipResult.data.length > 0
    ){

      restaurantId =
        membershipResult.data[0].restaurant_id;

    }else{

      const ownerResult = await db
        .from("restaurants")
        .select("*")
        .eq("owner_user_id",userId)
        .limit(1);

      if(ownerResult.error){
        throw ownerResult.error;
      }

      if(
        ownerResult.data &&
        ownerResult.data.length > 0
      ){

        restaurantId = ownerResult.data[0].id;

        await db
          .from("restaurant_users")
          .insert({
            restaurant_id:restaurantId,
            user_id:userId,
            role:"owner"
          });

      }else{

        const slug = crypto
          .randomUUID()
          .replaceAll("-","");

        const now = new Date();

        const trialEnd = new Date(
          now.getTime() + 24 * 60 * 60 * 1000
        );

        const createResult = await db
          .from("restaurants")
          .insert({
            name:"My Restaurant",
            owner_user_id:userId,
            public_slug:slug,
            trial_started_at:now.toISOString(),
            trial_ends_at:trialEnd.toISOString(),
            subscription_status:"trial"
          })
          .select("*")
          .single();

        if(createResult.error){
          throw createResult.error;
        }

        restaurantId = createResult.data.id;

        const membershipInsert = await db
          .from("restaurant_users")
          .insert({
            restaurant_id:restaurantId,
            user_id:userId,
            role:"owner"
          });

        if(membershipInsert.error){
          throw membershipInsert.error;
        }
      }
    }

    const restaurantResult = await db
      .from("restaurants")
      .select("*")
      .eq("id",restaurantId)
      .single();

    if(restaurantResult.error){
      throw restaurantResult.error;
    }

    restaurant = restaurantResult.data;

    if(!restaurant.public_slug){

      const newSlug = crypto
        .randomUUID()
        .replaceAll("-","");

      const updateResult = await db
        .from("restaurants")
        .update({
          public_slug:newSlug
        })
        .eq("id",restaurantId)
        .select("*")
        .single();

      if(!updateResult.error){
        restaurant = updateResult.data;
      }
    }

    document.getElementById("restaurantName").textContent =
      restaurant.name || "My Restaurant";

    if(!isSubscriptionActive()){

      document.getElementById("subscriptionBox")
        .classList.remove("hidden");

      return;
    }

    document.getElementById("authScreen")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    await startApp();

  }catch(error){

    console.error(error);
    showError(error.message);

  }
}


/* =========================
   TRIAL / SUBSCRIPTION
========================= */

function isSubscriptionActive(){

  const status =
    restaurant.subscription_status || "trial";

  if(status === "active"){

    if(!restaurant.subscription_ends_at){
      return true;
    }

    return new Date(restaurant.subscription_ends_at) > new Date();
  }

  if(status === "trial"){

    if(!restaurant.trial_ends_at){
      return true;
    }

    return new Date(restaurant.trial_ends_at) > new Date();
  }

  return false;
}

function showPaymentMessage(){

  alert(
    "₹599/month payment gateway next step mein connect karenge."
  );
}


/* =========================
   APP START
========================= */

async function startApp(){

  setupRealtime();
  startPolling();
  startMidnightRefresh();

  await openPage("dashboard");
}


/* =========================
   PAGE NAVIGATION
========================= */

async function openPage(page,button=null){

  currentPage = page;

  const titles = {
    dashboard:"Dashboard",
    orders:"Live Orders",
    menu:"Menu Management",
    tables:"Tables & QR",
    waiters:"Waiter Calls",
    complaints:"Complaints",
    feedback:"Feedback",
    billing:"Billing",
    payments:"Payments",
    profile:"Restaurant Profile",
    staff:"Staff",
    analytics:"Analytics",
    settings:"Settings"
  };

  document.getElementById("pageTitle").textContent =
    titles[page] || "Restaurant Admin";

  document.querySelectorAll(".nav-button")
    .forEach(item => item.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }else{
    const defaultButton =
      document.querySelector('[data-page="' + page + '"]');

    if(defaultButton){
      defaultButton.classList.add("active");
    }
  }

  if(page === "dashboard") await dashboardPage();
  if(page === "orders") await ordersPage();
  if(page === "menu") await menuPage();
  if(page === "tables") await tablesPage();
  if(page === "waiters") await waitersPage();
  if(page === "complaints") await complaintsPage();
  if(page === "feedback") await feedbackPage();
  if(page === "billing") await billingPage();
  if(page === "payments") await paymentsPage();
  if(page === "profile") await profilePage();
  if(page === "staff") await staffPage();
  if(page === "analytics") await analyticsPage();
  if(page === "settings") await settingsPage();
}


/* =========================
   ORDER QUERIES
========================= */

function getTodayRange(){

  const start = new Date();
  start.setHours(0,0,0,0);

  const end = new Date(start);
  end.setDate(end.getDate()+1);

  return {
    start:start.toISOString(),
    end:end.toISOString()
  };
}

async function getTodayOrders(){

  const range = getTodayRange();

  const result = await db
    .from("orders")
    .select("*")
    .eq("restaurant_id",restaurantId)
    .gte("created_at",range.start)
    .lt("created_at",range.end)
    .order("created_at",{ascending:false});

  if(result.error){
    throw result.error;
  }

  return result.data || [];
}

async function getAllOrders(){

  const result = await db
    .from("orders")
    .select("*")
    .eq("restaurant_id",restaurantId)
    .order("created_at",{ascending:false});

  if(result.error){
    throw result.error;
  }

  return result.data || [];
}


/* =========================
   DASHBOARD
========================= */

async function dashboardPage(){

  const orders = await getTodayOrders();

  const pending = orders.filter(order =>
    ["new","accepted","preparing"].includes(order.status)
  ).length;

  const completed = orders.filter(order =>
    ["ready","delivered","completed"].includes(order.status)
  ).length;

  const sales = orders.reduce(
    (total,order) => total + Number(order.total || 0),
    0
  );

  document.getElementById("content").innerHTML = `

    <div class="grid">

      <div class="card">
        <div class="stat-label">Today's Orders</div>
        <div class="stat-value">${orders.length}</div>
      </div>

      <div class="card">
        <div class="stat-label">Pending Orders</div>
        <div class="stat-value">${pending}</div>
      </div>

      <div class="card">
        <div class="stat-label">Completed Orders</div>
        <div class="stat-value">${completed}</div>
      </div>

      <div class="card">
        <div class="stat-label">Today's Sales</div>
        <div class="stat-value">${money(sales)}</div>
      </div>

    </div>

    <div class="section card">

      <h3>Today's Orders</h3>

      ${
        orders.length
        ? orders.slice(0,10).map(orderHTML).join("")
        : '<p class="muted">No orders today.</p>'
      }

    </div>
  `;
}


/* =========================
   LIVE ORDERS
========================= */

async function ordersPage(){

  const orders = await getTodayOrders();

  document.getElementById("content").innerHTML = `

    <div class="card">

      <h3>Today's Live Orders</h3>

      ${
        orders.length
        ? orders.map(orderHTML).join("")
        : '<p class="muted">No orders today.</p>'
      }

    </div>
  `;
}

function orderHTML(order){

  return `

    <div class="order-card">

      <b>Order #${escapeHTML(String(order.id).slice(0,8))}</b>

      <div class="badge">
        ${escapeHTML(order.status || "new")}
      </div>

      <p>
        <b>Table:</b>
        ${escapeHTML(order.table_id || "-")}
      </p>

      <p>
        <b>Total:</b>
        ${money(order.total)}
      </p>

      <p class="muted">
        ${new Date(order.created_at).toLocaleString()}
      </p>

      <label>Change Status</label>

      <select onchange="changeOrderStatus('${order.id}',this.value)">

        <option value="new" ${order.status==="new"?"selected":""}>
          New
        </option>

        <option value="accepted" ${order.status==="accepted"?"selected":""}>
          Accepted
        </option>

        <option value="preparing" ${order.status==="preparing"?"selected":""}>
          Preparing
        </option>

        <option value="ready" ${order.status==="ready"?"selected":""}>
          Ready
        </option>

        <option value="delivered" ${order.status==="delivered"?"selected":""}>
          Delivered
        </option>

        <option value="completed" ${order.status==="completed"?"selected":""}>
          Completed
        </option>

      </select>

    </div>
  `;
}

async function changeOrderStatus(orderId,status){

  const result = await db
    .from("orders")
    .update({status:status})
    .eq("id",orderId)
    .eq("restaurant_id",restaurantId);

  if(result.error){
    alert(result.error.message);
    return;
  }

  await openPage(currentPage);
}


/* =========================
   MENU
========================= */

async function menuPage(){

  const result = await db

/* =========================
   REALTIME
========================= */

function setupRealtime(){

  if(!restaurantId){
    return;
  }

  if(realtimeOrders){
    db.removeChannel(realtimeOrders);
  }

  realtimeOrders = db
    .channel("orders-" + restaurantId)
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"orders",
        filter:"restaurant_id=eq." + restaurantId
      },
      async()=>{
        if(
          currentPage === "dashboard" ||
          currentPage === "orders"
        ){
          await openPage(currentPage);
        }
      }
    )
    .subscribe();

  if(realtimeWaiters){
    db.removeChannel(realtimeWaiters);
  }

  realtimeWaiters = db
    .channel("waiters-" + restaurantId)
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"waiter_calls",
        filter:"restaurant_id=eq." + restaurantId
      },
      async()=>{
        if(currentPage === "waiters"){
          await waitersPage();
        }
      }
    )
    .subscribe();
}


/* =========================
   POLLING
========================= */

function startPolling(){

  if(pollingTimer){
    clearInterval(pollingTimer);
  }

  pollingTimer = setInterval(async()=>{

    try{

      const orders = await getTodayOrders();

      const latestOrderId =
        orders[0]?.id || null;

      if(!pollingStarted){

        lastOrderId = latestOrderId;

      }else if(
        latestOrderId &&
        latestOrderId !== lastOrderId
      ){

        lastOrderId = latestOrderId;

        if(
          currentPage === "dashboard" ||
          currentPage === "orders"
        ){
          await openPage(currentPage);
        }
      }

      const waiterResult = await db
        .from("waiter_calls")
        .select("id")
        .eq("restaurant_id",restaurantId)
        .eq("status","pending")
        .order("created_at",{ascending:false})
        .limit(1);

      const latestWaiterId =
        waiterResult.data?.[0]?.id || null;

      if(!pollingStarted){

        lastWaiterId = latestWaiterId;

      }else if(
        latestWaiterId &&
        latestWaiterId !== lastWaiterId
      ){

        lastWaiterId = latestWaiterId;

        if("Notification" in window){

          if(Notification.permission === "granted"){

            new Notification(
              "New Waiter Call",
              {
                body:"A customer requested a waiter."
              }
            );

          }
        }
      }

      pollingStarted = true;

    }catch(error){

      console.error("Polling error:",error);

    }

  },10000);
}


/* =========================
   MIDNIGHT REFRESH
========================= */

function startMidnightRefresh(){

  if(midnightTimer){
    clearTimeout(midnightTimer);
  }

  const now = new Date();

  const next = new Date(now);

  next.setDate(next.getDate()+1);
  next.setHours(0,0,2,0);

  midnightTimer = setTimeout(async()=>{

    if(
      currentPage === "dashboard" ||
      currentPage === "orders"
    ){
      await openPage(currentPage);
    }

    startMidnightRefresh();

  },Math.max(next-now,1000));
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  if(realtimeOrders){
    await db.removeChannel(realtimeOrders);
  }

  if(realtimeWaiters){
    await db.removeChannel(realtimeWaiters);
  }

  if(pollingTimer){
    clearInterval(pollingTimer);
  }

  if(midnightTimer){
    clearTimeout(midnightTimer);
  }

  await db.auth.signOut();

  window.location.replace(LOGIN_URL);
}
