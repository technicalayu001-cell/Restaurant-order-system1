<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Royal Restaurant</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f6f6;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:25px 18px;
  text-align:center;
}

header h1{
  font-size:27px;
  margin-bottom:8px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.welcome{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  margin-bottom:20px;
}

.table{
  display:inline-block;
  margin-top:12px;
  background:#eee;
  padding:8px 15px;
  border-radius:20px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-top:15px;
}

.food{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.food img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.food-info{
  padding:15px;
}

.food-info p{
  color:#666;
  margin:7px 0;
  font-size:14px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin:10px 0;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}

.add{
  width:100%;
  background:#111;
  color:white;
}

.cart{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-top:25px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin:18px 0;
}

.order-btn{
  width:100%;
  background:#e63946;
  color:white;
  font-size:16px;
}

.status{
  margin-top:15px;
  padding:15px;
  background:#eef7ff;
  border-radius:10px;
  display:none;
}

</style>
</head>

<body>

<header>
<h1>🍽️ Royal Restaurant</h1>
<p>Fresh Food • Great Taste</p>
</header>

<div class="container">

<div class="welcome">

<h2>Welcome!</h2>

<p>Order directly from your table.</p>

<div class="table">
🪑 Table No: <strong id="tableNumber">07</strong>
</div>

</div>

<h2>📋 Menu</h2>

<div id="menu" class="menu">

<p>Loading menu...</p>

</div>


<div class="cart">

<h2>🛒 Your Cart</h2>

<div id="cartItems">
<p style="color:#777;margin-top:12px;">
Your cart is empty.
</p>
</div>

<div class="total">
Total: ₹<span id="total">0</span>
</div>

<button class="order-btn" onclick="placeOrder()">
📦 Place Order
</button>

<div id="orderStatus" class="status"></div>

</div>

</div>


<script>

/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
"https://ltpjjckiaaonpetbzfvn.supabase.co";

const SUPABASE_KEY =
sb_publishable_skzmVVxdVcKTQaUbwqEaIg_-KDmA-3L

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   RESTAURANT ID
========================= */

let restaurantId = null;

let tableId = null;


/* =========================
   CART
========================= */

let cart = [];

let total = 0;


/* =========================
   LOAD RESTAURANT
========================= */

async function loadRestaurant(){

  const { data, error } =
  await supabaseClient
  .from("restaurants")
  .select("*")
  .limit(1)
  .maybeSingle();

  if(error){

    console.error(error);

    alert("Restaurant data load नहीं हो पाया.");

    return;

  }

  if(!data){

    alert(
      "Supabase में अभी restaurant बनाया नहीं गया है."
    );

    return;

  }

  restaurantId = data.id;

  document.querySelector("header h1")
  .innerText =
  "🍽️ " + data.name;

  loadMenu();

}


/* =========================
   LOAD MENU
========================= */

async function loadMenu(){

  const { data, error } =
  await supabaseClient
  .from("menu_items")
  .select("*")
  .eq("restaurant_id",restaurantId)
  .eq("is_available",true)
  .order("created_at");

  const menu =
  document.getElementById("menu");

  if(error){

    console.error(error);

    menu.innerHTML =
    "<p>Menu load नहीं हो पाया.</p>";

    return;

  }

  if(!data || data.length === 0){

    menu.innerHTML =
    "<p>अभी menu available नहीं है.</p>";

    return;

  }

  menu.innerHTML = "";

  data.forEach(item => {

    const card =
    document.createElement("div");

    card.className = "food";

    card.innerHTML = `

      <img
        src="${item.image_url || 'https://via.placeholder.com/500x300?text=Food'}"
        alt="${item.name}"
      >

      <div class="food-info">

        <h3>${item.name}</h3>

        <p>${item.description || ""}</p>

        <div class="price">
          ₹${item.price}
        </div>

        <button
          class="add"
          onclick='addToCart(${JSON.stringify(item)})'
        >
          Add to Cart
        </button>

      </div>

    `;

    menu.appendChild(card);

  });

}


/* =========================
   ADD CART
========================= */

function addToCart(item){

  cart.push(item);

  total += Number(item.price);

  updateCart();

}


/* =========================
   UPDATE CART
========================= */

function updateCart(){

  const box =
  document.getElementById("cartItems");

  box.innerHTML = "";

  cart.forEach((item,index)=>{

    const row =
    document.createElement("div");

    row.className =
    "cart-item";

    row.innerHTML = `

      <span>
        ${item.name}
      </span>

      <span>
        ₹${item.price}

        <button
          onclick="removeItem(${index})"
          style="padding:5px 8px;margin-left:5px;"
        >
          ❌
        </button>

      </span>

    `;

    box.appendChild(row);

  });


  if(cart.length === 0){

    box.innerHTML =
    '<p style="color:#777;">Your cart is empty.</p>';

  }


  document.getElementById("total")
  .innerText = total;

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

  total -= Number(cart[index].price);

  cart.splice(index,1);

  updateCart();

}


/* =========================
   PLACE ORDER
========================= */

async function placeOrder(){

  if(cart.length === 0){

    alert("पहले food को cart में add करो.");

    return;

  }

  if(!restaurantId){

    alert("Restaurant load नहीं हुआ.");

    return;

  }


  /* CREATE ORDER */

  const { data: order, error } =
  await supabaseClient
  .from("orders")
  .insert({

    restaurant_id:
    restaurantId,

    table_id:
    tableId,

    status:
    "new",

    estimated_minutes:
    15,

    total:
    total,

    payment_method:
    "cash",

    payment_status:
    "pending"

  })
  .select()
  .single();


  if(error){

    console.error(error);

    alert(
      "Order place नहीं हुआ.\n" +
      error.message
    );

    return;

  }


  /* CREATE ORDER ITEMS */

  const items =
  cart.map(item => ({

    order_id:
    order.id,

    menu_item_id:
    item.id,

    quantity:
    1,

    price:
    item.price

  }));


  const { error:itemError } =
  await supabaseClient
  .from("order_items")
  .insert(items);


  if(itemError){

    console.error(itemError);

    alert(
      "Order बना लेकिन items save नहीं हुए."
    );

    return;

  }


  document.getElementById("orderStatus")
  .style.display = "block";

  document.getElementById("orderStatus")
  .innerHTML = `

    <strong>✅ Order Placed!</strong>

    <br><br>

    Order ID:
    ${order.id.substring(0,8)}

    <br>

    Status:
    <strong>🟡 Order Received</strong>

    <br>

    Estimated Time:
    <strong>15 minutes</strong>

  `;


  cart = [];

  total = 0;

  updateCart();

}


/* =========================
   START
========================= */

loadRestaurant();

</script>

</body>
</html>
